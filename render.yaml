services:
  - type: web
    name: meridian-automation-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: CUA_MODEL
        value: claude-sonnet-4-5
      - key: LOG_LEVEL
        value: INFO
      # Mandatory for this unauthenticated public submission surface. Never
      # disable this with real credentials; use a private deployment instead.
      - key: PUBLIC_DEMO_READ_ONLY
        value: "true"
      # Runs the bundled synthetic legacy bank inside the same service, so
      # the public demo needs no private bank or LLM credentials to work.
      - key: PUBLIC_DEMO_SYNTHETIC
        value: "true"
